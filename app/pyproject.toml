[project]
name = "CxKitty"
version = "0.4.5"
description = "超星学习通答题姬. 媒体播放、章节测验、课程考试, 集成式自动化工具"
readme = "README.md"
license = "GPL-3.0-only"
authors = [{ name = "SocialSisterYi", email = "1440239038@qq.com" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "requests>=2.32.3,<3",
    "qrcode>=8.2,<9",
    "rich>=15.0.0,<16",
    "pycryptodome>=3.23.0,<4",
    "lxml>=6.0.0,<7",
    "pyyaml>=6.0.2,<7",
    "jsonpath-python>=1.1.6,<2",
    "beautifulsoup4>=4.13.0,<5",
    "ddddocr>=1.6.1,<2",
    "numpy>=2.2.6,<3",
    "dataclasses-json>=0.6.7,<0.7",
    "yarl>=1.24.0,<2",
    # 与 ddddocr 保持一致: 桌面端用完整版, linux (docker) 用 headless 版, 以省去 GUI 系统库依赖
    "opencv-python>=4.12,<6; sys_platform == 'win32' or sys_platform == 'darwin'",
    "opencv-python-headless>=4.12,<6; sys_platform == 'linux'",
]

[project.urls]
repository = "https://github.com/SocialSisterYi/CxKitty"


[tool.poetry]
# 本项目以应用形式分发, 不作为 python 包安装
package-mode = false


[[tool.poetry.source]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
# poetry 2.x 已移除 "default", 声明 primary 源后 PyPI 不再隐式加入
priority = "primary"


[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
isort = "^8.0.1"

[tool.black]
line-length = 100

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
