name: Verify Setup

# 验证三个平台的环境准备脚本能真正跑通, 并对装出来的环境做离线冒烟测试。
# 注意: app/.github/ 下的 workflow 不在仓库根目录, GitHub 不会执行, 那些是上游的发布流程。

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows (嵌入式 3.13)
          - os: ubuntu-latest
            name: Linux (venv)
          - os: macos-latest
            name: macOS (venv)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Windows PowerShell 5.1 (启动.bat 调的就是它) 对没有 BOM 的脚本按 ANSI 解码,
      # 中文注释会被解成乱码并直接把脚本解析坏, 所以 .ps1 必须带 UTF-8 BOM
      - name: PowerShell 脚本 BOM 检查 (Unix)
        if: runner.os != 'Windows'
        run: |
          for f in scripts/*.ps1; do
            # macOS 的 BSD od 与 GNU od 的分隔宽度不同, 去掉空白后再比对
            head=$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')
            [ "$head" = "efbbbf" ] || { echo "$f 缺少 UTF-8 BOM (开头 3 字节: $head)"; exit 1; }
            echo "ok: $f 带 BOM"
          done

      # 非 windows 平台不自动装解释器, 启动器应当只提示并退出 (退出码 1)
      - name: 启动器缺环境提示检查 (Unix)
        if: runner.os != 'Windows'
        run: |
          set +e
          out=$(./启动.sh < /dev/null 2>&1); code=$?
          set -e
          echo "$out"
          [ "$code" -eq 1 ] || { echo "期望退出码 1, 实际 $code"; exit 1; }
          echo "$out" | grep -q "未检测到 Python 环境" || { echo "缺少'未检测到环境'提示"; exit 1; }
          [ ! -e .venv ] || { echo "本平台不应自动创建 .venv"; exit 1; }
          echo "ok: 缺环境时只提示, 未自动安装"

      - name: 准备环境 (Windows)
        if: runner.os == 'Windows'
        run: .\scripts\setup-windows.ps1

      - name: 准备环境 (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/setup-linux.sh

      - name: 准备环境 (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/setup-macos.sh

      - name: 检查解释器版本 (Windows)
        if: runner.os == 'Windows'
        run: |
          .\runtime\python.exe -V
          Get-Content .\runtime\python*._pth
          .\runtime\python.exe -m pip check

      - name: 检查解释器版本 (Unix)
        if: runner.os != 'Windows'
        run: |
          ./.venv/bin/python -V
          ./.venv/bin/python -m pip check

      - name: 依赖版本检查回归测试 (Windows)
        if: runner.os == 'Windows'
        run: .\runtime\python.exe -m unittest discover -s scripts -p "test_*.py"

      - name: 依赖版本检查回归测试 (Unix)
        if: runner.os != 'Windows'
        run: ./.venv/bin/python -m unittest discover -s scripts -p "test_*.py"

      - name: 冒烟测试 (Windows)
        if: runner.os == 'Windows'
        run: .\runtime\python.exe .\scripts\smoke_test.py

      - name: 冒烟测试 (Unix)
        if: runner.os != 'Windows'
        run: ./.venv/bin/python ./scripts/smoke_test.py

      # 回归检查: 输出被重定向时 windows 会退回 cp1252, 中文直接编码失败。
      # 这里强制 cp1252 拉起主程序, 确认 main.py 里的兜底生效 (不经过 .bat 的 PYTHONUTF8)
      - name: 中文输出回归检查 (Windows, 模拟 cp1252)
        if: runner.os == 'Windows'
        run: |
          $env:PYTHONIOENCODING = "cp1252"
          $out = (cmd /c "cd app && ..\runtime\python.exe main.py < NUL 2>&1") -join "`n"
          if ($out -notmatch "会话存档为空") {
              Write-Host $out
              throw "main.py 在 cp1252 环境下未能正常输出中文"
          }
          Write-Host "ok: cp1252 环境下 logo 与中文提示均正常输出"
          $LASTEXITCODE = 0

      # 启动器是纯 batch, 只能在 windows 上验证: 用 NUL 作标准输入跑一遍,
      # 菜单里的"无输入"分支会先启动一次程序, 连续两次空输入后正常退出 (返回码 0)
      # 断言只匹配 ASCII 部分, 避免控制台代码页把中文解成乱码导致误报
      - name: 启动器菜单回归检查 (Windows)
        if: runner.os == 'Windows'
        run: |
          $out = (cmd /c "启动.bat < NUL 2>&1") -join "`n"
          $code = $LASTEXITCODE
          if ($code -ne 0) { Write-Host $out; throw "启动.bat 返回码 $code" }
          foreach ($needle in @("CxKitty", "[1]", "[2]", "[4]")) {
              if ($out -notmatch [regex]::Escape($needle)) {
                  Write-Host $out
                  throw "启动.bat 输出缺少: $needle"
              }
          }
          Write-Host "ok: 启动器菜单渲染正常, 空输入可启动程序并正常退出"
          $LASTEXITCODE = 0

      - name: 启动器菜单回归检查 (Unix)
        if: runner.os != 'Windows'
        run: |
          out=$(./启动.sh < /dev/null 2>&1)
          echo "$out"
          echo "$out" | grep -q "CxKitty" || { echo "菜单未渲染"; exit 1; }
          echo "$out" | grep -q "\[2\]" || { echo "菜单项缺失"; exit 1; }
          echo "ok: 环境就绪时启动器正常出菜单"

      # 卸掉一个包制造"环境不完整", 启动器应当自己发现并补装 (无需用户干预)
      - name: 启动器自动补装依赖检查 (Windows)
        if: runner.os == 'Windows'
        run: |
          .\runtime\python.exe -m pip uninstall -y qrcode | Out-Null
          .\runtime\python.exe .\scripts\check_env.py
          if ($LASTEXITCODE -eq 0) { throw "卸载 qrcode 后环境自检仍通过, 检测逻辑没生效" }
          $out = (cmd /c "启动.bat < NUL 2>&1") -join "`n"
          .\runtime\python.exe .\scripts\check_env.py
          if ($LASTEXITCODE -ne 0) { Write-Host $out; throw "启动器未自动补回缺失的依赖" }
          Write-Host "ok: 依赖缺失时启动器自动补装"
          $LASTEXITCODE = 0

      - name: 幂等性检查 (重复执行应跳过安装)
        if: runner.os == 'Windows'
        run: .\scripts\setup-windows.ps1

      # 用旧的 qrcode 验证版本漂移后的自动同步, 不安装已知有漏洞的 multidict。
      - name: 旧依赖自动升级检查 (Windows)
        if: runner.os == 'Windows'
        run: |
          .\runtime\python.exe -m pip install --no-deps "qrcode==8.1"
          if ($LASTEXITCODE -ne 0) { throw "无法准备旧版依赖" }
          .\runtime\python.exe .\scripts\check_env.py
          if ($LASTEXITCODE -eq 0) { throw "旧版 qrcode 未被检测到" }
          $out = (cmd /c "启动.bat < NUL 2>&1") -join "`n"
          .\runtime\python.exe .\scripts\check_env.py
          if ($LASTEXITCODE -ne 0) { Write-Host $out; throw "启动器未升级旧版依赖" }
          .\runtime\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw "依赖升级后存在冲突" }

  poetry:
    name: poetry 依赖解析
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: 安装 poetry
        run: |
          pipx install "poetry==2.5.1"
          pipx inject poetry "poetry-plugin-export==1.10.1"
      - name: 校验 pyproject 与 lock 一致
        working-directory: app
        run: |
          poetry check
          poetry check --lock
          poetry export --only main --without-hashes --format requirements.txt --output "$RUNNER_TEMP/requirements.txt"
          diff -u requirements.txt "$RUNNER_TEMP/requirements.txt"
      - name: 按 lock 安装依赖
        working-directory: app
        run: poetry install --only main
      - name: 冒烟测试
        working-directory: app
        run: poetry run python ../scripts/smoke_test.py

  security:
    name: 全平台锁定依赖安全审计
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: 安装审计工具
        run: python -m pip install "pip-audit==2.10.1"
      - name: 审计全部运行及开发依赖
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path("app/poetry.lock").read_text(encoding="utf-8"))
          # 去掉平台标记, 同时覆盖 Windows/macOS 专用包与开发依赖。
          pins = sorted({f"{p['name']}=={p['version']}" for p in lock["package"]})
          Path(os.environ["RUNNER_TEMP"], "audit-pins.txt").write_text("\n".join(pins) + "\n", encoding="utf-8")
          PY
          python -m pip_audit --no-deps --disable-pip -r "$RUNNER_TEMP/audit-pins.txt"

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 构建镜像
        run: docker build --tag cxkitty:ci app/
      - name: 容器内冒烟测试
        run: |
          docker run --rm --entrypoint poetry \
            -v "$PWD/scripts:/smoke:ro" \
            cxkitty:ci run python /smoke/smoke_test.py
