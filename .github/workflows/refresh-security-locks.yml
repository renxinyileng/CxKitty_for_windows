name: Refresh security dependency locks

# Rebuild both exported dependency files when a security branch changes its constraints.
# Generated commits made with GITHUB_TOKEN do not recursively trigger this workflow.
on:
  push:
    branches:
      - 'security/**'
    paths:
      - 'app/pyproject.toml'

permissions:
  contents: write

jobs:
  refresh:
    name: Regenerate Poetry lock and requirements
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Poetry and export plugin
        run: |
          pipx install 'poetry==2.3.3'
          pipx inject poetry 'poetry-plugin-export>=1.10.1,<2'
      - name: Resolve and export updated dependencies
        working-directory: app
        run: |
          poetry lock
          poetry check --lock
          poetry export --format requirements.txt --only main --without-hashes --output requirements.txt
      - name: Verify installed dependencies and run smoke tests
        working-directory: app
        run: |
          poetry install --only main
          poetry run python ../scripts/smoke_test.py
      - name: Commit regenerated dependency files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/poetry.lock app/requirements.txt
          if ! git diff --cached --quiet; then
            git commit -m 'fix(security): regenerate safe dependency locks'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
